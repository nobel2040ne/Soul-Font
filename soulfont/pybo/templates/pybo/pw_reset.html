{% extends 'pybo/base.html' %}
{% load static %}

{% block title %}Password Reset{% endblock %}

{% block app_name %}Finder{% endblock %}

{% block content %}
  <div class="app">
    <div data-drag class="window app-window narrow">
      <div class="title-bar">
        <a class="close" href="{% url 'desktop' %}" aria-label="Close" data-close></a>
        <h1 class="title">Password Reset</h1>
        <span class="zoom" aria-hidden="true"></span>
      </div>
      <div class="separator"></div>

      <div class="window-pane" style="text-align:center;">
        <p class="lede">Password reset is not supported yet.</p>
        <div class="center-row">
          <button class="btn default" onclick="navigateWithFade('{% url 'login' %}')">Log In</button>
        </div>
      </div>
    </div>
  </div>

{% endblock %}
